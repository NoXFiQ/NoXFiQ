name: soko_kitaa
description: A product marketplace app for Tanzania with premium features
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Firebase
  firebase_core: ^2.24.2
  firebase_auth: ^4.15.3
  cloud_firestore: ^4.13.6
  firebase_storage: ^11.5.6
  firebase_messaging: ^14.7.10
  
  # Google Maps & Location
  google_maps_flutter: ^2.5.0
  location: ^5.0.3
  geocoding: ^2.1.1
  geolocator: ^10.1.0
  
  # Image handling
  image_picker: ^1.0.4
  cached_network_image: ^3.3.0
  
  # HTTP & State Management
  http: ^1.1.0
  provider: ^6.1.1
  
  # UI Components
  flutter_localizations:
    sdk: flutter
  intl: ^0.18.1
  
  # OTP & Phone Auth
  pin_code_fields: ^8.0.1
  country_code_picker: ^3.0.0
  
  # Payment Integration
  flutter_paystack: ^1.0.7
  
  # Other utilities
  shared_preferences: ^2.2.2
  uuid: ^4.2.1
  timeago: ^3.6.0
  flutter_rating_bar: ^4.0.1
  
  # Icons
  cupertino_icons: ^1.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
    - assets/translations/
  
  fonts:
    - family: CustomFont
      fonts:
        - asset: assets/fonts/regular.ttf
        - asset: assets/fonts/bold.ttf
          weight: 700